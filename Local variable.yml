    - models/task1.2/AAPL_k7.keras
    - models/task1.2/MSFT_k3.keras
    - models/task1.2/MSFT_k7.keras
    - models/task1.2/NVDA_k3.keras
    - models/task1.2/NVDA_k7.keras
  task1.3:
    - models/task1.3/AAPL_k3.keras
    - models/task1.3/AAPL_k7.keras
    - models/task1.3/MSFT_k3.keras
    - models/task1.3/MSFT_k7.keras
    - models/task1.3/NVDA_k3.keras
    - models/task1.3/NVDA_k7.keras
  task2.1:
    - models/task2.1/VCB_lstm.keras
    - models/task2.1/HPG_lstm.keras
    - models/task2.1/FPT_lstm.keras
    - models/task2.1/VNM_lstm.keras
    - models/task2.1/MSN_lstm.keras
    - models/task2.1/MWG_lstm.keras
  task2.2:
    - models/task2.2/VCB_k3.keras
    - models/task2.2/VCB_k7.keras
    - models/task2.2/HPG_k3.keras
    - models/task2.2/HPG_k7.keras
    - models/task2.2/FPT_k3.keras
    - models/task2.2/FPT_k7.keras
    - models/task2.2/VNM_k3.keras
    - models/task2.2/VNM_k7.keras
    - models/task2.2/MSN_k3.keras
    - models/task2.2/MSN_k7.keras
    - models/task2.2/MWG_k3.keras
    - models/task2.2/MWG_k7.keras
  task2.3:
    - models/task2.3/VCB_k3.keras
    - models/task2.3/VCB_k7.keras
    - models/task2.3/HPG_k3.keras
    - models/task2.3/HPG_k7.keras
    - models/task2.3/FPT_k3.keras
    - models/task2.3/FPT_k7.keras
    - models/task2.3/VNM_k3.keras
    - models/task2.3/VNM_k7.keras
    - models/task2.3/MSN_k3.keras
