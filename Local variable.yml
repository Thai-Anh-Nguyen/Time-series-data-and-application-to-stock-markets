# Local variable namespace map for 240039-project-notebook.ipynb
# ---------------------------------------------------------------
# A grep-friendly reference for every important name defined by the notebook,
# grouped by category and annotated with shape / dtype / where defined.
# Keep this in sync when adding new tasks or models.

constants:
  FEATURE_COLS:
    value: [Open, High, Low, Close, Volume, Adjusted Close,
            daily_return, MA5, MA20, RSI, MACD, MACD_signal, volatility]
    n: 13
    defined_in: "cell 8151b94d (1.1)"
    note: "Column order of the per-window feature tensor for Task 1 (Nasdaq) — must not change once windows are built."
  LABEL_COL:
    value: "Adjusted Close"
    defined_in: "cell 8151b94d (1.1)"
  TICKERS:
    value: [AAPL, MSFT, NVDA]
    defined_in: "cell 3a2b8653 (1.1 extension)"
  K_VALUES:
    value: [3, 7]
    defined_in: "cell fd9e01f9 (1.2)"
    note: "Forecast horizons used in 1.2 / 1.3 / 2.2 / 2.3 (k = 1 is handled by 1.1 / 2.1)."
  MODELS_DIR:
    value: "Path('models')"
    defined_in: "cell 3f6164fb (checkpoint utilities)"
  VN_FEATURE_COLS:
    value: [Open, High, Low, Close, Volume,
            daily_return, MA5, MA20, RSI, MACD, MACD_signal, volatility]
    n: 12
    defined_in: "Task 2.1 (Vietnam loading cell)"
    note: "Column order of the per-window feature tensor for Task 2 (Vietnam) — no Adjusted Close column."
  VN_LABEL_COL:
    value: "Close"
    defined_in: "Task 2.1 (Vietnam loading cell)"
    note: "Vietnam CSVs have no Adjusted Close → label is raw Close. The pipeline is otherwise identical."
  VN_TICKERS:
    value: [VCB, HPG, FPT, VNM, MSN, MWG]
    defined_in: "Task 2.1 (Vietnam loading cell)"
  VN_DATA_DIR:
    value: "Path('Vietnam data/stock-historical-data')"
    defined_in: "Task 2.1 (Vietnam loading cell)"
  SIGNAL_HORIZON:
    value: 5
    defined_in: "Task 3 helpers cell"
    note: "Task 3 forward-window length in trading days — used by both 3.1 (buy) and 3.2 (sell)."
  SIGNAL_THRESHOLD:
    value: 0.02
    defined_in: "Task 3 helpers cell"
    note: "Task 3 fractional-return cutoff (|Close[t+h]/Close[t] − 1| > τ → positive class)."
  PORTFOLIO_HORIZON:
    value: 5
    defined_in: "Task 4 helpers cell"
    note: "Rebalance / forecast horizon in trading days; uses step 5 of the Task 2.3 k=7 multistep model."
  VOL_WINDOW:
    value: 20
    defined_in: "Task 4 helpers cell"
    note: "Window length for trailing realised volatility (std of daily returns)."
  PRUDENT_LAMBDA:
    value: 2.0
    defined_in: "Task 4 helpers cell"
    note: "Risk-penalty multiplier for the prudent investor (heavy)."
  AGGRESSIVE_LAMBDA:
    value: 0.5
    defined_in: "Task 4 helpers cell"
    note: "Risk-penalty multiplier for the aggressive investor (light)."
  PRUDENT_WEIGHT_CAP:
    value: 0.25
    defined_in: "Task 4 helpers cell"
    note: "Max single-name weight in the prudent portfolio."
  AGGRESSIVE_WEIGHT_CAP:
    value: 0.50
    defined_in: "Task 4 helpers cell"
    note: "Max single-name weight in the aggressive portfolio."
  PRUDENT_EXCLUDE_TOP_K:
    value: 1
    defined_in: "Task 4 helpers cell"
    note: "Number of riskiest names hard-excluded from the prudent portfolio each rebalance day."
  PORTFOLIO_TRADING_DAYS:
    value: 252
    defined_in: "Task 4 helpers cell"
    note: "Trading days per year used to annualise Sharpe and return."

raw_dataframes:           # loaded straight from Nasdaq data/csv/<ticker>.csv
  AAPL:    {rows: 10590, defined_in: "cell 7ed3d11b"}
  MSFT:    {rows:  9264, defined_in: "cell d070ee04"}
  NVDA:    {rows:  6013, defined_in: "cell 6f7990ff"}
  RAW_FRAMES:
    type: "dict[str, DataFrame]"
    keys: [AAPL, MSFT, NVDA]
    defined_in: "cell fd9e01f9 (1.2)"

vn_raw_dataframes:        # loaded via load_vietnam(t) from Vietnam data/stock-historical-data/<t>-VNINDEX-History.csv
  VCB:     {rows: 3413, defined_in: "Task 2.1 (Vietnam loading cell)"}
  HPG:     {rows: 3809, defined_in: "Task 2.1 (Vietnam loading cell)"}
  FPT:     {rows: 4038, defined_in: "Task 2.1 (Vietnam loading cell)"}
  VNM:     {rows: 4264, defined_in: "Task 2.1 (Vietnam loading cell)"}
  MSN:     {rows: 3322, defined_in: "Task 2.1 (Vietnam loading cell)"}
  MWG:     {rows: 2157, defined_in: "Task 2.1 (Vietnam loading cell)"}
  VN_RAW_FRAMES:
    type: "dict[str, DataFrame]"
    keys: [VCB, HPG, FPT, VNM, MSN, MWG]
    defined_in: "Task 2.1 (Vietnam loading cell)"
    note: "load_vietnam(t) drops the leading unnamed index column and renames TradingDate → Date."

feature_engineered_dataframes:  # output of add_technical_features(...).dropna()
  feat_aapl:
    cols: "raw + 7 engineered indicators + parsed Date"
    defined_in: "cell 57c2ae6c (used by AAPL plot)"
    used_by: ["1.1 AAPL plot", "1.2 AAPL plot"]
  feat_vcb:
    cols: "raw + 7 engineered indicators + parsed Date (no Adj Close)"
    defined_in: "Task 2.1 (VCB split-boundary plot cell)"
    used_by: ["2.1 VCB plot", "2.2 VCB plot", "2.3 VCB trajectory plot"]
  feat: "(local helper var in cell 25806c13 — split-boundary plot only)"

splits:                   # output of build_pipeline → Split(X, y, label_min, label_max)
  # k = 1 (Task 1.1)
  AAPL_train: {shape: "(7378, 30, 13)", defined_in: "cell 63ec1fdb"}
  AAPL_val:   {shape: "(1581, 30, 13)", defined_in: "cell 63ec1fdb"}
  AAPL_test:  {shape: "(1581, 30, 13)", defined_in: "cell 63ec1fdb"}
  MSFT_train: {shape: "(6449, 30, 13)", defined_in: "cell 63ec1fdb"}
  MSFT_val:   {shape: "(1382, 30, 13)", defined_in: "cell 63ec1fdb"}
  MSFT_test:  {shape: "(1383, 30, 13)", defined_in: "cell 63ec1fdb"}
  NVDA_train: {shape: "(4173, 30, 13)", defined_in: "cell 63ec1fdb"}
  NVDA_val:   {shape: " (895, 30, 13)", defined_in: "cell 63ec1fdb"}
  NVDA_test:  {shape: " (895, 30, 13)", defined_in: "cell 63ec1fdb"}
  SPLITS_K1:
    type: "dict[str, (train, val, test)]"
    defined_in: "cell 3a2b8653 (1.1 extension)"

  # k = 1 (Task 2.1) — Vietnam splits. n_features = 12 (no Adj Close).
  VN_SPLITS_K1:
    type: "dict[str, (train, val, test)]"
    keys: [VCB, HPG, FPT, VNM, MSN, MWG]
    defined_in: "Task 2.1 (pipeline cell)"
    sizes:
      VCB: "train (2353, 30, 12)  val (505, 30, 12)  test (505, 30, 12)"
      HPG: "train (2631, 30, 12)  val (564, 30, 12)  test (564, 30, 12)"
      FPT: "train (2790, 30, 12)  val (599, 30, 12)  test (599, 30, 12)"
      VNM: "train (2949, 30, 12)  val (632, 30, 12)  test (633, 30, 12)"
      MSN: "train (2290, 30, 12)  val (491, 30, 12)  test (491, 30, 12)"
      MWG: "train (1474, 30, 12)  val (316, 30, 12)  test (317, 30, 12)"

  # Task 3 — classification splits. Same shape as VN_SPLITS_K1 minus a few windows
  # (horizon=5 instead of 1 → `len(arr) − window_size − horizon + 1` shrinks by 4 per ticker).
  # Returned by build_pipeline_classification; not stored in a global dict — read via
  # results_vn_buy[t]['train'].X.shape (and ditto for results_vn_sell).
  VN_CLF_SPLIT_SIZES:
    type: "documentation only — actual splits live in results_vn_buy / results_vn_sell"
    defined_in: "Task 3 (build_pipeline_classification, horizon=5)"
    sizes:
      VCB: "train (2351, 30, 12)  val (504, 30, 12)  test (504, 30, 12)"
      HPG: "train (2627, 30, 12)  val (564, 30, 12)  test (564, 30, 12)"
      FPT: "train (2788, 30, 12)  val (598, 30, 12)  test (598, 30, 12)"
      VNM: "train (2946, 30, 12)  val (632, 30, 12)  test (632, 30, 12)"
      MSN: "train (2286, 30, 12)  val (491, 30, 12)  test (491, 30, 12)"
      MWG: "train (1471, 30, 12)  val (316, 30, 12)  test (316, 30, 12)"
    note: "Identical sizes for buy and sell — direction only changes label values, not window counts."
    pos_rate_buy:
      VCB: 0.307
      HPG: 0.357
      FPT: 0.296
      VNM: 0.270
      MSN: 0.307
      MWG: 0.352
    pos_rate_sell:
      VCB: 0.268
      HPG: 0.305
      FPT: 0.255
      VNM: 0.218
      MSN: 0.285
      MWG: 0.255

models:                   # all checkpointed under models/<task>/<name>.keras
  # Task 1.1 — k = 1
  AAPL_LSTM_model: {arch: "LSTM(64)→Dense(1)", defined_in: "cell 6cea4be6", ckpt: "models/task1.1/AAPL_lstm.keras"}
  MSFT_LSTM_model: {arch: "LSTM(64)→Dense(1)", defined_in: "cell 3a2b8653", ckpt: "models/task1.1/MSFT_lstm.keras"}
  NVDA_LSTM_model: {arch: "LSTM(64)→Dense(1)", defined_in: "cell 3a2b8653", ckpt: "models/task1.1/NVDA_lstm.keras"}

  # All k = 1 results in one place (used by the 1.2 comparison table)
  results_k1:
    type: "dict[str, dict]"
    key: "ticker"
    fields: [model, history, train, val, test]
    keys_present: [AAPL, MSFT, NVDA]
    defined_in: "cell 3a2b8653"

  # Task 1.2 — k ∈ {3, 7} × {AAPL, MSFT, NVDA}
  results_kth:
    type: "dict[tuple[str, int], dict]"
    key: "(ticker, k)"
    fields: [model, history, train, val, test]
    keys_present:
      - "('AAPL', 3)"
      - "('AAPL', 7)"
      - "('MSFT', 3)"
      - "('MSFT', 7)"
      - "('NVDA', 3)"
      - "('NVDA', 7)"
    defined_in: "cell fd9e01f9"
    ckpt_pattern: "models/task1.2/<TICKER>_k<k>.keras"

  # Task 1.3 — k ∈ {3, 7} × {AAPL, MSFT, NVDA}; Dense(k) head, vector label
  results_kday:
    type: "dict[tuple[str, int], dict]"
    key: "(ticker, k)"
    fields: [model, history, train, val, test]
    keys_present:
      - "('AAPL', 3)"
      - "('AAPL', 7)"
      - "('MSFT', 3)"
      - "('MSFT', 7)"
      - "('NVDA', 3)"
      - "('NVDA', 7)"
    defined_in: "cell 0824af0d"
    ckpt_pattern: "models/task1.3/<TICKER>_k<k>.keras"
    note: "Splits are MultiStepSplit (y has shape (N, k)). Models output a length-k vector."

  # Task 2.1 — k = 1 × {VCB, HPG, FPT, VNM, MSN, MWG}; LSTM(64) → Dense(1) on 12 features
  results_vn_k1:
    type: "dict[str, dict]"
    key: "ticker"
    fields: [model, history, train, val, test]
    keys_present: [VCB, HPG, FPT, VNM, MSN, MWG]
    defined_in: "Task 2.1 (training loop cell)"
    ckpt_pattern: "models/task2.1/<TICKER>_lstm.keras"

  # Task 2.2 — k ∈ {3, 7} × {VCB, HPG, FPT, VNM, MSN, MWG}; same arch as 2.1
  results_vn_kth:
    type: "dict[tuple[str, int], dict]"
    key: "(ticker, k)"
    fields: [model, history, train, val, test]
    keys_present:
      - "('VCB', 3)"
      - "('VCB', 7)"
      - "('HPG', 3)"
      - "('HPG', 7)"
      - "('FPT', 3)"
      - "('FPT', 7)"
      - "('VNM', 3)"
      - "('VNM', 7)"
      - "('MSN', 3)"
      - "('MSN', 7)"
      - "('MWG', 3)"
      - "('MWG', 7)"
    defined_in: "Task 2.2 (training loop cell)"
    ckpt_pattern: "models/task2.2/<TICKER>_k<k>.keras"

  # Task 2.3 — k ∈ {3, 7} × {VCB, HPG, FPT, VNM, MSN, MWG}; Dense(k) head, vector label
  results_vn_kday:
    type: "dict[tuple[str, int], dict]"
    key: "(ticker, k)"
    fields: [model, history, train, val, test]
    keys_present:
      - "('VCB', 3)"
      - "('VCB', 7)"
      - "('HPG', 3)"
      - "('HPG', 7)"
      - "('FPT', 3)"
      - "('FPT', 7)"
      - "('VNM', 3)"
      - "('VNM', 7)"
      - "('MSN', 3)"
      - "('MSN', 7)"
      - "('MWG', 3)"
      - "('MWG', 7)"
    defined_in: "Task 2.3 (training loop cell)"
    ckpt_pattern: "models/task2.3/<TICKER>_k<k>.keras"
    note: "Splits are MultiStepSplit (y has shape (N, k)). Models output a length-k vector."

  # Task 3.1 — buy-signal classifiers, one per Vietnam ticker.
  # arch: LSTM(64) → Dropout(0.2) → Dense(1, sigmoid); loss = binary_crossentropy.
  results_vn_buy:
    type: "dict[str, dict]"
    key: "ticker"
    fields: [model, history, train, val, test, threshold]
    keys_present: [VCB, HPG, FPT, VNM, MSN, MWG]
    defined_in: "Task 3.1 (training loop cell)"
    ckpt_pattern: "models/task3.1/<TICKER>_buy.keras"
    note: |
      `train`/`val`/`test` are ClfSplit namedtuples (.X, .y only — no label_min/label_max
      since 0/1 labels need no denormalisation). `threshold` is the val-tuned decision θ
      that maximises F1 on val (ties broken by precision); always pass it to
      evaluate_test_clf(...) downstream, not 0.5.

  # Task 3.2 — sell-signal classifiers, mirror of 3.1.
  results_vn_sell:
    type: "dict[str, dict]"
    key: "ticker"
    fields: [model, history, train, val, test, threshold]
    keys_present: [VCB, HPG, FPT, VNM, MSN, MWG]
    defined_in: "Task 3.2 (training loop cell)"
    ckpt_pattern: "models/task3.2/<TICKER>_sell.keras"
    note: "Same structure as results_vn_buy. Direction='sell' flips the label condition."

  # Task 4 — no new model checkpoints. Just derived panels and backtest outputs.
  test_panel:
    type: "dict[str, DataFrame]"
    key: "ticker"
    fields:
      Date:              "pd.Timestamp — decision day = last day of input window"
      Close:             "float — Close on decision day"
      e_return:          "float — predicted 5-day return from Task 2.3 (k=7, step 5)"
      realized_h_return: "float — realised 5-day return; used for backtest only, never in scoring"
      rolling_vol:       "float — trailing 20-day std of daily Close returns at decision day"
      p_sell:            "float — Task 3.2 sell probability at decision day"
    keys_present: [VCB, HPG, FPT, VNM, MSN, MWG]
    defined_in: "Task 4 (build_test_panel call in §4.1 cell)"
    note: "Per-ticker date set is the intersection of Task 2.3 (k=7) and Task 3.2 (h=5) test windows; differs by 2 dates per ticker — handled by an inner merge in ticker_test_frame."
  risk_wide:
    type: "DataFrame[date × ticker]"
    defined_in: "Task 4 §4.2 cell"
    note: "Cross-sectional risk in [0,1]: row min-max of (0.5·z(rolling_vol) + 0.5·z(p_sell)). High = riskier within the panel on that day."
  portfolio_results:
    type: "dict[str, dict]"
    key: "profile  (one of 'prudent', 'aggressive', 'equal')"
    fields:
      nav:      "pd.Series — NAV indexed by daily dates, starts at 1.0"
      returns:  "pd.Series — daily portfolio returns"
      weights:  "DataFrame[decision_date × ticker] — weights at each rebalance day"
      metrics:  "dict — {Annualised Return, Sharpe, Max Drawdown}"
    defined_in: "Task 4 §4.3 backtest cell"
    note: "Equal-weight is the benchmark; prudent / aggressive use the score-based weights."

histories:
  history:
    type: "tf.keras.callbacks.History"
    refers_to: "AAPL k=1 training (cell 6cea4be6)"
    used_by: "training-curve plot (cell 8f054cbc)"

helpers:                  # function-name → defined_in
  add_technical_features:        "cell 6ce09c79 (reused by Task 1 + Task 2 pipelines unchanged)"
  build_pipeline:                "cell 8151b94d — signature now: (df, name, window_size=30, horizon=1, val_ratio=0.15, test_ratio=0.15, verbose=True, feature_cols=None, label_col=None). Defaults to Nasdaq globals; Task 2 passes VN_FEATURE_COLS / VN_LABEL_COL."
  denormalize_label:             "cell 8151b94d (Task 1 + Task 2)"
  Split (namedtuple):            "cell 8151b94d"
  checkpoint_path:               "cell 3f6164fb"
  train_with_checkpoint:         "cell 3f6164fb"
  build_lstm:                    "cell 3a2b8653 (1.1 extension; reused by 1.2, 2.1, 2.2)"
  evaluate_test:                 "cell 3a2b8653 (1.1 extension; reused by 1.2, 2.1, 2.2)"
  MultiStepSplit (namedtuple):   "cell 99e59430 (1.3; reused by 2.3)"
  build_pipeline_multistep:      "cell 99e59430 — signature now: (df, name, k, window_size=30, val_ratio=0.15, test_ratio=0.15, verbose=True, feature_cols=None, label_col=None). Defaults to Nasdaq globals; Task 2.3 passes VN_FEATURE_COLS / VN_LABEL_COL."
  build_lstm_multistep:          "cell 99e59430 (1.3; reused by 2.3)"
  denormalize_label_multistep:   "cell 99e59430 (1.3; reused by 2.3)"
  evaluate_test_multistep:       "cell 99e59430 (1.3; reused by 2.3)"
  load_vietnam:                  "Task 2.1 (Vietnam loading cell) — drops leading unnamed index column, renames TradingDate → Date, parses dates."
  ClfSplit (namedtuple):         "Task 3 helpers cell — fields (X, y); classification analogue of Split (no label_min/label_max)."
  make_signal_labels:            "Task 3 helpers cell — signature: (close, horizon, threshold, direction). Returns int8 0/1 array length len(close), with the last `horizon` rows NaN-padded → dropped by the pipeline's window cap."
  build_pipeline_classification: "Task 3 helpers cell — signature: (df, name, horizon=5, threshold=0.02, direction='buy', window_size=30, val_ratio=0.15, test_ratio=0.15, verbose=True, feature_cols=None, label_col=None). Defaults to Nasdaq globals; Task 3 always passes VN_FEATURE_COLS / VN_LABEL_COL."
  build_lstm_classifier:         "Task 3 helpers cell — LSTM(64) → Dropout(0.2) → Dense(1, sigmoid); BCE loss; built-in metrics [accuracy, AUC, Precision, Recall]."
  tune_decision_threshold:       "Task 3 helpers cell — signature: (model, val_split, grid=None). Sweeps θ ∈ {0.05, …, 0.95} (default), returns θ maximising F1 (ties broken by precision)."
  evaluate_test_clf:             "Task 3 helpers cell — signature: (model, test_split, decision_threshold=0.5). Returns (y_true, y_prob, y_pred, metrics) with keys Accuracy, Precision, Recall, F1, ROC-AUC, threshold, pos_rate, pred_pos, CM."
  predict_h_step_close:          "Task 4 helpers cell — signature: (model, test_split, h). Predicts → denormalises → returns 1-D array of the h-step-ahead Close. Used by ticker_test_frame for E[return]."
  ticker_test_frame:             "Task 4 helpers cell — signature: (ticker, h=PORTFOLIO_HORIZON). Returns DataFrame[Date, Close, e_return, realized_h_return, rolling_vol, p_sell] over the test window. Merges Task 2.3 (k=7) and Task 3.2 (h=5) sides on Date (inner)."
  build_test_panel:              "Task 4 helpers cell — returns {ticker → ticker_test_frame(ticker)} for every VN_TICKERS entry."
  _wide:                         "Task 4 helpers cell — signature: (panel, col). Pivots one column across tickers into a wide DataFrame[date × ticker]."
  _zrows:                        "Task 4 helpers cell — row z-score (cross-sectional across tickers, per day)."
  compute_risk_panel:            "Task 4 helpers cell — signature: (panel). Returns DataFrame[date × ticker] of risk in [0,1]: row min-max of (0.5·z(vol) + 0.5·z(p_sell))."
  compute_score:                 "Task 4 helpers cell — signature: (e_return_wide, risk_wide, lam). Returns E[return] − λ·risk; indices preserved."
  _row_weights:                  "Task 4 helpers cell — water-filling weights for a single day. Signature: (score_row, exclude_set, weight_cap). Clips negatives → 0, caps names that would exceed the cap, redistributes leftover mass; always sums to 1 if cap·n_active ≥ 1."
  build_weights:                 "Task 4 helpers cell — signature: (score_wide, risk_wide, weight_cap, exclude_top_k). Applies _row_weights per date; excludes the top-K riskiest names each day when exclude_top_k > 0."
  equal_weights_like:            "Task 4 helpers cell — signature: (score_wide). Equal-weight benchmark DataFrame with the same index/columns."
  daily_returns_calendar:        "Task 4 helpers cell — signature: (panel). Returns DataFrame[date × ticker] of raw daily Close-to-Close returns, used for NAV computation in backtest()."
  backtest:                      "Task 4 helpers cell — signature: (weights, daily_returns, rebalance_every=PORTFOLIO_HORIZON). Walk-forward backtest; weights fixed between rebalances. Returns (nav, port_daily, active_weights)."
  portfolio_metrics:             "Task 4 helpers cell — signature: (nav, port_daily, trading_days=252). Returns {Annualised Return, Sharpe, Max Drawdown}. Sharpe uses rf=0 and the std of port_daily."

